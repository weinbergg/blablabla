# blablablarden.ru — paste into the server { } block (or replace the proxy-only config).
# Then: nginx -t && systemctl reload nginx
#
# Critical: serve /_next/static from disk. When next-server returns 400 for CSS/JS,
# the site looks unstyled on every device.

server {
    listen 80;
    listen [::]:80;
    server_name blablablarden.ru www.blablablarden.ru;

    # If you terminate TLS elsewhere, keep only the proxy + static bits below
    # inside your existing 443 server block instead.

    client_max_body_size 80m;

    # Must be BEFORE location /. Do NOT use try_files here — with alias it
    # breaks paths that contain [id] (URL-encoded as %5Bid%5D) and books fail
    # with ChunkLoadError / HTTP 400 from Next.
    location /_next/static/ {
        alias /var/www/blabla/.next/static/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        alias /var/www/blabla/public/uploads/;
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
