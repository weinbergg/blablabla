# blablablarden.ru — paste into the server { } block (or replace the proxy-only config).
# Then: nginx -t && systemctl reload nginx
#
# Critical: serve /_next/static from static-assets/ (accumulated hashed files),
# NOT from .next/static directly. deploy/release.sh merges each build there so
# old open tabs and new HTML never 404 each other's chunks.

server {
    listen 80;
    listen [::]:80;
    server_name blablablarden.ru www.blablablarden.ru;

    client_max_body_size 80m;

    # Must be BEFORE location /. Do NOT use try_files with alias — it breaks
    # paths that contain [id] (URL-encoded as %5Bid%5D).
    location /_next/static/ {
        alias /var/www/blabla/static-assets/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Prefer `root` (not alias+try_files): try_files with alias often 404s
    # even when the file exists, which breaks every new import in the reader.
    location /uploads/ {
        root /var/www/blabla/public;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
