# blablablarden.ru — paste into the server { } block (or replace the proxy-only config).
# Then: nginx -t && systemctl reload nginx
#
# Critical: serve /_next/static from static-assets/ (accumulated hashed files),
# NOT from .next/static directly. deploy/release.sh merges each build there so
# old open tabs and new HTML never 404 each other's chunks.

server {
    listen 80;
    listen [::]:80;
    server_name blablablarden.ru www.blablablarden.ru;

    # Books are scans: a single folio PDF can be 300–400 MB, an import archive
    # more. 80m used to bounce those with a bare 413 (and the admin UI could
    # only show "не удалось выполнить импорт").
    client_max_body_size 2g;
    client_body_timeout 900s;
    client_body_buffer_size 1m;

    # Streaming upload + bulk import. Must come before `location /`.
    # proxy_request_buffering off: the app writes the body to disk as it
    # arrives, so nginx shouldn't spool the whole file first.
    location ~ ^/api/(uploads/stage|admin/bulk-import) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2g;
        client_body_timeout 900s;
        proxy_request_buffering off;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # Must be BEFORE location /. Do NOT use try_files with alias — it breaks
    # paths that contain [id] (URL-encoded as %5Bid%5D).
    location /_next/static/ {
        alias /var/www/blabla/static-assets/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Книги больше НЕ отдаются по прямой ссылке: иначе фонд выкачивается
    # циклом по /uploads/<uuid>.pdf без аккаунта. Единственный вход —
    # /api/files/<id>, который проверяет права и отвечает X-Accel-Redirect
    # на этот internal-location (файл шлёт nginx, приложение не держит байты).
    location /protected-uploads/ {
        internal;
        alias /var/www/blabla/public/uploads/;
        access_log off;
    }

    # Старые прямые ссылки закрываем явно.
    location /uploads/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
