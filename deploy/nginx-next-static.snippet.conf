/**
 * Optional nginx snippet for serving Next static assets from disk.
 * Drop into the server block for blablablarden.ru (then: nginx -t && systemctl reload nginx).
 *
 * Why: when `next start` returns 400 for `/_next/static/*` (stale build / orphan
 * process), nginx can still serve CSS/JS directly from `.next/static`.
 */
/*
location /_next/static/ {
    alias /var/www/blabla/.next/static/;
    access_log off;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
*/
